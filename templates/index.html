<!DOCTYPE html>
<html>
<head>
    <title>Digit Generator</title>
</head>
<body>
    <h1>Generate MNIST Digits</h1>
    <form method="post">
        <label for="digit">Choose a digit (0–9):</label>
        <input type="number" name="digit" min="0" max="9" required>
        <input type="submit" value="Generate">
    </form>

    {% if images %}
        <h2>Generated Images for Digit {{ digit }}</h2>
        {% for img in images %}
            <img src="{{ img }}" style="margin:10px;" />
        {% endfor %}
    {% endif %}
</body>
</html>
